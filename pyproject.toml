[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "anchor"
version = "0.1.0"
description = "A runtime grounding gate for LLM outputs - catch hallucinated claims with exact citations."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [{name = "hnvivek"}]
dependencies = [
    "sentence-transformers>=2.5",
    "transformers>=4.40",
    "sentencepiece>=0.2",
    "numpy",
]

[project.optional-dependencies]
app = ["fastapi>=0.110", "uvicorn[standard]>=0.27"]

[tool.setuptools]
packages = ["anchor"]
