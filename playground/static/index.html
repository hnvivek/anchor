<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>anchor — fact-check for AI outputs</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  .badge{display:inline-block;background:#eef2ff;color:#4338ca;border-radius:5px;padding:0 5px;font-size:.68rem;font-weight:700;margin:0 1px;cursor:pointer}
  .badge:hover{background:#e0e7ff}
  .warn{display:inline-block;background:#fef2f2;color:#b91c1c;border-radius:5px;padding:1px 6px;font-size:.72rem;font-weight:700}
  .ok{display:inline-block;background:#ecfdf5;color:#047857;border-radius:5px;padding:1px 6px;font-size:.72rem;font-weight:700}
  .claim-g{border-bottom:2px solid #2563eb;cursor:pointer}
  .claim-g:hover{background:#eff6ff}
  .claim-bad{border-bottom:2px wavy #dc2626;cursor:help;background:#fef2f2}
  .claim-bad:hover{background:#fee2e2}
  .chunk{padding:6px 10px;font-size:.8rem;color:#475569;line-height:1.5;border-left:2px solid #e2e8f0;margin-bottom:6px;transition:background .25s,border-color .25s}
  .chunk:hover{background:#f8fafc}
  .chunk.flash{background:#fef9c3;border-left-color:#eab308;animation:flash 1.8s ease-out}
  @keyframes flash{0%{background:#fef08a}100%{background:transparent}}
  .libscroll::-webkit-scrollbar{width:6px}
  .libscroll::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:3px}
</style>
</head>
<body class="h-screen flex flex-col bg-slate-50 text-slate-800">
  <header class="shrink-0 px-6 py-3 border-b border-slate-200 bg-white">
    <div class="flex items-baseline gap-3 flex-wrap">
      <h1 class="text-xl font-bold tracking-tight">⚓ anchor</h1>
      <span class="text-sm text-slate-500">fact-check for AI outputs</span>
      <span class="text-xs text-slate-400 ml-auto">blue = cited (click the number to jump to the source) · red = needs review</span>
    </div>
  </header>

  <main class="flex-1 grid lg:grid-cols-3 overflow-hidden">
    <section class="lg:col-span-2 overflow-y-auto px-6 py-4 border-r border-slate-200">
      <div class="bg-white rounded-xl border border-slate-200 p-4 mb-3 shadow-sm">
        <h2 class="font-semibold text-sm mb-2">AI answer to check <span class="text-slate-400 font-normal">- verified against the whole source library →</span></h2>
        <textarea id="answer" rows="4" class="w-full rounded-lg border border-slate-300 p-2.5 text-sm"></textarea>
        <button id="run" onclick="verify()" class="mt-2 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-lg px-5 py-2 text-sm">Verify</button>
      </div>
      <div id="resultsec" class="hidden bg-white rounded-xl border border-slate-200 p-4 shadow-sm">
        <div class="flex items-center justify-between mb-2">
          <h2 class="font-semibold text-sm">Verified answer</h2>
          <div id="summary" class="text-xs"></div>
        </div>
        <div id="result" class="leading-relaxed text-[15px]"></div>
        <h3 class="text-xs font-semibold text-slate-500 mt-4 mb-1">Citations</h3>
        <div id="citations" class="text-xs space-y-1 text-slate-600"></div>
      </div>
    </section>

    <section class="overflow-y-auto libscroll px-4 py-4 bg-white">
      <div class="flex items-center justify-between mb-2 sticky top-0 bg-white pb-1">
        <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Source library <span id="srccount" class="font-normal normal-case"></span></h2>
        <button onclick="toggleAdd()" class="text-xs bg-indigo-600 hover:bg-indigo-700 text-white rounded px-2 py-1">+ Add</button>
      </div>
      <div id="addform" class="hidden mb-3 p-2.5 border border-slate-200 rounded-lg bg-slate-50">
        <input id="newname" placeholder="Document name" class="w-full text-xs border border-slate-300 rounded px-2 py-1 mb-1"/>
        <textarea id="newtext" rows="4" placeholder="Paste the source text (use blank lines between paragraphs)..." class="w-full text-xs border border-slate-300 rounded px-2 py-1"></textarea>
        <button onclick="addSource()" class="mt-1 text-xs bg-slate-800 text-white rounded px-2 py-1">Add to library</button>
      </div>
      <div id="library" class="text-slate-400 text-xs">Loading library…</div>
    </section>
  </main>

<script>
let sources = [];
let lastResult = null;
const $ = id => document.getElementById(id);
const esc = s => (s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const docName = id => { const s = sources.find(x => x.id === id); return s ? (s.name || s.id) : id; };

// chunk into PARAGRAPHS (runs of non-blank lines) with exact char offsets.
// Citation offsets are sentence-level, so zoomToCitation maps a citation to the
// paragraph whose [start,end) contains it - same text, so it always lands right.
function chunkParas(text){
  const out = [];
  let i = 0;
  while (i < text.length){
    while (i < text.length && text[i] === '\n') i++;
    if (i >= text.length) break;
    const start = i;
    let j = i;
    while (j < text.length){ if (text[j] === '\n' && j+1 < text.length && text[j+1] === '\n') break; j++; }
    const raw = text.slice(start, j), t = raw.trim();
    if (t) out.push({text: t, start: start, end: start + raw.length});
    i = j;
  }
  return out;
}
function renderPara(text){ return esc(text).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>'); }

async function loadSamples(){
  const r = await fetch('/api/samples').then(r => r.json());
  sources = r.samples.slice();
  $('answer').value = r.answer;
  renderLibrary();
}
function toggleAdd(){ $('addform').classList.toggle('hidden'); if (!$('addform').classList.contains('hidden')) $('newname').focus(); }
function addSource(){
  const name = $('newname').value.trim() || 'My document';
  const text = $('newtext').value.trim();
  if (!text) return;
  sources.push({id: 'custom-' + Date.now(), name, text});
  $('newname').value = ''; $('newtext').value = '';
  $('addform').classList.add('hidden');
  renderLibrary();
}
function removeSource(i){ sources.splice(i, 1); renderLibrary(); }
function renderLibrary(){
  $('srccount').textContent = `(${sources.length})`;
  $('library').innerHTML = sources.length ? sources.map((s, i) => {
    const blocks = chunkParas(s.text).map(p =>
      `<div class="chunk" id="chunk-${s.id}-${p.start}" data-doc="${s.id}" data-start="${p.start}" data-end="${p.end}">${renderPara(p.text)}</div>`).join('');
    return `<div class="mb-4 group">
      <div class="flex items-center justify-between mb-1">
        <div class="text-xs font-bold text-slate-600">${esc(s.name || s.id)}</div>
        <button onclick="removeSource(${i})" class="text-slate-300 hover:text-red-600 text-xs opacity-0 group-hover:opacity-100">✕</button>
      </div>${blocks}</div>`;
  }).join('') : '<div class="text-slate-400">No sources. Click "+ Add" to paste one.</div>';
}
async function verify(){
  $('run').disabled = true; $('run').textContent = 'Verifying…';
  try {
    const r = await fetch('/api/verify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sources, answer:$('answer').value})}).then(r=>r.json());
    lastResult = r;
    $('resultsec').classList.remove('hidden');
    $('result').innerHTML = (r.claims||[]).map(c => {
      if (c.citation){
        const tip = `Cited — ${docName(c.citation.doc_id)}: “${c.citation.snippet}”`;
        return `<span class="claim-g" title="${esc(tip)}" onclick="zoomToCitation(${c.citation.n})">${esc(c.text)}<span class="badge ml-0.5">${c.citation.n}</span></span> `;
      }
      if (c.grounded) return `<span>${esc(c.text)}</span> `;
      return `<span class="claim-bad" title="Not found in any source">${esc(c.text)}</span> `;
    }).join('') || '<span class="text-slate-400">No claims.</span>';
    const ng = (r.claims||[]).filter(c=>c.grounded).length;
    const nf = (r.claims||[]).length - ng;
    $('summary').innerHTML = `<span class="ok">${ng} cited</span> · <span class="warn">${nf} review</span> · <span class="text-slate-400">${r.ms ?? '?'}ms</span>`;
    const cits = (r.claims||[]).filter(c=>c.citation);
    $('citations').innerHTML = cits.length ? cits.map(c=>`<div class="flex gap-1.5"><span class="badge shrink-0">${c.citation.n}</span><span><b>${esc(docName(c.citation.doc_id))}</b> — “${esc(c.citation.snippet)}”</span></div>`).join('') : '<div class="text-slate-400">None.</div>';
    $('resultsec').scrollIntoView({behavior:'smooth', block:'nearest'});
  } catch(e){
    $('resultsec').classList.remove('hidden');
    $('result').innerHTML = '<span class="warn">error: '+esc(e.message||String(e))+'</span>';
  }
  $('run').disabled = false; $('run').textContent = 'Verify';
}
function zoomToCitation(n){
  const claim = (lastResult && lastResult.claims || []).find(c => c.citation && c.citation.n === n);
  if (!claim) return;
  const start = claim.citation.start, doc_id = claim.citation.doc_id;
  for (const el of document.querySelectorAll(`.chunk[data-doc="${doc_id}"]`)){
    const s = +el.dataset.start, e = +el.dataset.end;
    if (start >= s && start < e){
      el.scrollIntoView({behavior:'smooth', block:'center'});
      el.classList.add('flash');
      setTimeout(() => el.classList.remove('flash'), 1800);
      return;
    }
  }
}
loadSamples();
</script>
</body>
</html>
